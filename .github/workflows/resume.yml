name: Build resume

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/cache@v5
        with:
          path: .typsume/fonts
          key: ${{ runner.os }}-typsume-fonts-${{ hashFiles('typsume.config.toml') }}
          restore-keys: |
            ${{ runner.os }}-typsume-fonts-
      - run: bunx @typsume/cli@latest build resume.toml --output resume.pdf --allow-downloads
      - uses: actions/upload-artifact@v7
        with:
          path: resume.pdf
          archive: false
          if-no-files-found: error
