name: Build resume

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bunx @typsume/cli@latest build resume.toml --output resume.pdf --allow-downloads
      - uses: actions/upload-artifact@v7
        with:
          name: resume
          path: resume.pdf
          if-no-files-found: error
