name: Semifold CI
on:
  push:
    branches: [main]

env:
  CLICOLOR_FORCE: 1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
        with:
          version: v0.3.0-rc.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: actions/cache@v5
        with:
          path: .typsume/fonts
          key: ${{ runner.os }}-typsume-fonts-${{ hashFiles('typsume.config.toml') }}
          restore-keys: |
            ${{ runner.os }}-typsume-fonts-
      - name: Build Resume
        run: bunx @typsume/cli@latest build resume.toml --output resume.pdf --allow-downloads
      - uses: actions/upload-artifact@v7
        with:
          path: resume.pdf
          archive: false
          if-no-files-found: error
      - name: Semifold CI
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
